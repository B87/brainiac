[package]
name = "brainiac"
version = "0.6.1"
description = "Second brain and Git workspace tracker for programmers"
authors = ["Brainiac contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.88"
# `pnpm tauri dev` runs `cargo run`. The runner is selected with `--bin`.
default-run = "brainiac"

[lib]
name = "brainiac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["app"]
# The GUI and the Keychain. The Linux `brainiac-runner` binary is built
# without this feature (docs/architecture.md, Remote hosts).
app = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-notification",
  "dep:security-framework",
]
# Builds the Linux `brainiac-runner` binary. Off by default so that the app's
# bundle, which takes every binary built, does not look for a universal copy
# of it: on this Mac the controller is `brainiac runner`.
runner = []

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
# macOS notifications for workspace activity, sent from Rust only (docs/architecture.md, Security).
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks", "column_decltype"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "io-std", "net", "fs", "signal"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Notes (v0.2): headings, text, and links from Markdown; content hashes as note versions.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Agent access (v0.2.x): the MCP server, its tool schemas, and the socket's peer user ID.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros"] }
schemars = "1"
libc = "0.2"
# Pull requests (v0.3): GitHub and Bitbucket Cloud over HTTPS (rustls, macOS trust store),
# and account tokens in the macOS Keychain.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }
security-framework = { version = "3", optional = true }
# Databases (v0.4): PostgreSQL over its extended protocol with rustls (the same
# rustls, crypto provider, and macOS trust store verifier that reqwest uses).
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Agent runs (v0.5): the run controller drives containers through the Docker
# Engine API on the chosen engine's socket, including the attach stream
# (an upgraded connection) that carries the agent's protocol.
bollard = { version = "0.19", default-features = false, features = ["pipe"] }

[dev-dependencies]
tempfile = "3"
# Tests drive the MCP server as an agent would.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "client"] }

[[bin]]
name = "brainiac"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "brainiac-runner"
path = "src/runner_main.rs"
required-features = ["runner"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
