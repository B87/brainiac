[package]
name = "brainiac"
version = "0.3.1"
description = "Second brain and Git workspace tracker for programmers"
authors = ["Brainiac contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "brainiac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# macOS notifications for workspace activity, sent from Rust only (docs/architecture.md, Security).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "io-std", "net"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Notes (v0.2): headings, text, and links from Markdown; content hashes as note versions.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Agent access (v0.2.x): the MCP server, its tool schemas, and the socket's peer user ID.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros"] }
schemars = "1"
libc = "0.2"
# Pull requests (v0.3): GitHub and Bitbucket Cloud over HTTPS (rustls, macOS trust store),
# and account tokens in the macOS Keychain.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }
security-framework = "3"

[dev-dependencies]
tempfile = "3"
# Tests drive the MCP server as an agent would.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "client"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
