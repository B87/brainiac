[package]
name = "brainiac"
version = "0.1.3"
description = "Second brain and Git workspace tracker for programmers"
authors = ["Brainiac contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "brainiac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# macOS notifications for workspace activity, sent from Rust only (docs/architecture.md, Security).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
