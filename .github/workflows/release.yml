name: Release

# Runs when scripts/release.sh pushes a `vX.Y.Z` tag. Builds the Linux run
# controller for each processor a run host may have, then a universal macOS
# bundle that carries those controllers' SHA-256, signs the updater artifact
# with the minisign key from the repository secrets, and opens a DRAFT GitHub
# release holding the .dmg, the .app.tar.gz + .sig pair used by the in-app
# updater, latest.json, and the two controllers. Publish the draft with
# scripts/publish-release.sh once you have checked it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  runner:
    # The program a run host gets (src-tauri/src/agents/runner_binary.rs),
    # built as a checkout builds it on a Mac: in the rust:1.88 image, so it
    # needs the same glibc on the host. Each processor builds natively.
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build brainiac-runner for linux/${{ matrix.arch }}
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" -w /src/src-tauri rust:1.88 \
            bash -c "cargo build --locked --release --no-default-features --features runner --bin brainiac-runner --target-dir /tmp/target && cp /tmp/target/release/brainiac-runner /out/brainiac-runner-linux-${{ matrix.arch }}"
          file out/brainiac-runner-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.arch }}
          path: out/brainiac-runner-linux-${{ matrix.arch }}
          if-no-files-found: error

  build:
    needs: runner
    # The app still runs on macOS 13: tauri.conf.json sets the minimum
    # version, whatever macOS builds it.
    runs-on: macos-26
    env:
      # `secrets` cannot be used in `if:`; mirror presence into env first.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in the manifests
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$version" '
            /^## \[/ { printing = index($0, "[" ver "]") > 0; next }
            /^\[[^]]+\]: / { next }   # skip link reference definitions at the bottom
            printing { print }
          ' CHANGELOG.md)
          if [[ -z "$notes" ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Rust (version from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      # The action's `targets` input only applies to its own `stable` channel;
      # the pinned toolchain from rust-toolchain.toml needs the targets added itself.
      - name: Add macOS targets to the pinned toolchain
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Apple Developer signing + notarization is optional. Without it the app
      # is ad-hoc signed and first-time users must right-click > Open.
      - name: Enable Apple code signing (only when secrets are configured)
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: runner-*
          path: runner
          merge-multiple: true

      # Compiled into the app, which downloads only a controller with this
      # digest from this release.
      - name: Record the run controllers' SHA-256 for the app
        run: |
          for arch in amd64 arm64; do
            digest=$(shasum -a 256 "runner/brainiac-runner-linux-$arch" | cut -d' ' -f1)
            upper=$(tr '[:lower:]' '[:upper:]' <<<"$arch")
            echo "BRAINIAC_RUNNER_SHA256_LINUX_$upper=$digest" >> "$GITHUB_ENV"
            echo "linux/$arch $digest"
          done

      - name: Build, sign and upload to a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key pair generated with `pnpm tauri signer generate`.
          # The matching public key lives in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Brainiac ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          args: --target universal-apple-darwin

      - name: Add the run controllers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" runner/brainiac-runner-linux-amd64 runner/brainiac-runner-linux-arm64 --clobber
