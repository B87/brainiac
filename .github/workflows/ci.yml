name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The macOS maintainers develop on, so Playwright installs the same WebKit
    # build here as locally and a failure here can be reproduced there.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Manifest versions agree
        run: scripts/check-version.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Rust (version from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The database tests start a throwaway PostgreSQL server with initdb
      # and pg_ctl; without them they skip (docs/architecture.md, Databases).
      - name: PostgreSQL for the database tests
        run: |
          brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"

      - name: Rust format
        run: pnpm format:rust:check
      - name: Clippy
        run: pnpm lint:rust
      - name: Rust tests (also regenerates TypeScript bindings)
        run: pnpm test:rust
      - name: Bindings are committed and current
        run: git diff --exit-code -- src/lib/generated
      - name: Biome
        run: pnpm check:web
      - name: TypeScript
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: WebKit for the editor tests
        run: pnpm exec playwright install webkit
      - name: Editor tests in WebKit
        run: pnpm test:editor
      - name: Frontend build
        run: pnpm build

  linux:
    # Brainiac ships for macOS only; this job keeps the code building and its
    # tests passing on Linux, so a new macOS-only assumption shows up here
    # (docs/design/linux.md, phase 1). The oldest baseline the design names:
    # glibc 2.35 and webkit2gtk-4.1. The WebKit view tests are not run yet:
    # they press ⌘, which is Ctrl on Linux, until shortcuts have one helper.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Rust (version from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The runner image has PostgreSQL installed but not on the PATH; the
      # database tests start a throwaway server with its initdb and pg_ctl.
      - name: PostgreSQL for the database tests
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"

      - name: Project check (format, Clippy, Rust and frontend tests)
        run: pnpm check
      - name: Bindings are committed and current
        run: git diff --exit-code -- src/lib/generated
      - name: Frontend build
        run: pnpm build
